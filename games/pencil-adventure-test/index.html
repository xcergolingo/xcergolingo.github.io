<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pencil Adventure</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:repeating-linear-gradient(#fffdf1 0 27px,#b9d8ed 28px 29px);font-family:'Comic Sans MS',cursive;color:#234d89;user-select:none}canvas{display:block}#world{position:fixed;inset:0}#menu,#hud,#answers{position:fixed;left:0;right:0;padding:16px}#menu{inset:0;overflow:auto;background:repeating-linear-gradient(#fffdf1ed 0 27px,#b9d8eded 28px 29px);text-align:center;border-left:3px solid #eaa0a0}h1{font-size:clamp(30px,6vw,55px);margin:12px}button,input,textarea{font:inherit;color:inherit}button{background:#fffdf5;border:2px solid #345c97;border-radius:8px;padding:10px;cursor:pointer;box-shadow:2px 3px #9ab3d0}button:active{transform:translateY(2px)}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;margin:25px auto}.photo{width: min(240px,85vw);background:white;padding:12px 12px 20px;transform:rotate(-2deg);position:relative;box-shadow:3px 5px 10px #0002}.photo:nth-child(2){transform:rotate(2deg)}.photo:before{content:'';position:absolute;width:80px;height:22px;background:#e6ce8ba0;top:-12px;left:33%;transform:rotate(-7deg)}.photo svg{width:100%;height:110px;background:#edf5fa}.photo b{display:block;font-size:22px}#hud{top:0;display:none;text-align:center;pointer-events:none}#hud button{pointer-events:auto}#stats{display:flex;justify-content:space-between;align-items:center}#question{display:inline-block;background:#fffdf5ed;border:2px solid #345c97;padding:8px 20px;border-radius:8px;font-size:clamp(18px,4vw,30px);margin:8px}#answers{bottom:0;display:none;background:repeating-linear-gradient(#fffdf1 0 27px,#b9d8ed 28px 29px);border-top:2px solid #345c97;text-align:center;padding-bottom:max(12px,env(safe-area-inset-bottom))}#choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#choices button{min-width:75px}#entry{width:min(90%,400px);padding:8px;background:transparent;border:0;border-bottom:2px solid #345c97;user-select:text}#flash{position:fixed;top:35%;width:100%;text-align:center;font-size:clamp(30px,7vw,65px);color:#ef781e;text-shadow:2px 2px white;pointer-events:none;font-weight:bold}textarea{width:min(90%,600px);height:80px;background:#fffdf5}small{display:block}#dots{letter-spacing:3px}#world.fallback:after{content:"✏️";position:absolute;top:38%;left:45%;font-size:85px;animation:bounce .5s infinite alternate}@keyframes bounce{to{transform:translateY(-15px)}}#subjects{display:flex;justify-content:center;gap:14px;margin:18px}#subjects button{font-size:20px;padding:12px 25px;transform:rotate(-2deg);background:#fffef7}#subjects button:nth-child(2){transform:rotate(2deg)}#answers{border-left:3px solid #eaa0a0}#flash{color:#d63e36;font-style:italic;transform:rotate(-5deg)}.photo svg{background:repeating-linear-gradient(#fffdf1 0 13px,#c5d9eb 14px 15px)} </style></head><body><div id="world"></div><div id="menu"><h1>✎ Pencil Adventure</h1><p>GoLingo • A little practice, a big adventure.</p><p>Japanese → English • 5 sample words</p><button id="sample">▶ Play sample lesson</button><div id="subjects"><button data-sub="read">Read</button> <button data-sub="spell">Spell</button> <button data-sub="listen">Listen</button></div><div class="cards" id="cards"></div><details><summary>Load your own GoLingo lesson</summary><textarea id="data" placeholder="Paste GoLingo JSON"></textarea><br><button id="load">Load lesson</button><small id="status">Sample Japanese lesson ready</small></details></div><div id="hud"><div id="stats"><button id="back">← Menu</button><span id="dots"></span><b id="score">★ 0</b><b id="combo">🔥 ×1</b></div><div id="question"></div><button id="speak">🔊</button></div><div id="answers"><div id="hint"></div><div id="choices"></div><form id="form"><input id="entry" autocomplete="off" placeholder="Write your answer"><button>✓</button></form></div><div id="flash"></div><script>
let build=()=>{}, confetti=()=>{}; let graphicsReady=false;

const modes=['Rooftop Run','Blot Stop','Rocket Pencils','Ruler Flick','Hook City'];const subtitles=['Vocabulary','Listening & spelling','Sentence challenge','Listening targets','Sentence collection'];const drawings=['<path d="M0 95 L100 55 200 95 M15 85V25H50V75 M65 70V10H95V55 M120 65V20H155V80 M170 85V35H195V95"/>','<path d="M0 95Q120 100 80 55T200 10" stroke-width="22" opacity=".3"/><path d="M20 20l40 20m-35 -30l40 20 M140 75l30 -40"/>','<ellipse cx="100" cy="60" rx="85" ry="35"/><ellipse cx="100" cy="60" rx="55" ry="19"/><path d="M20 60h25m110 0h25"/>'];modes.forEach((m,i)=>{let b=document.createElement('button');b.className='photo';b.innerHTML=`<svg viewBox="0 0 200 110" fill="none" stroke="#315e99" stroke-width="2">${drawings[i%3]}<g transform="translate(95 45) rotate(12)"><rect width="10" height="35" fill="#ffd34d"/><rect width="10" height="8" fill="#ed92a4"/><path d="M0 35l5 10 5 -10" fill="#eac49a"/></g></svg><b>${m}</b>${subtitles[i]}`;b.onclick=()=>start(i);$('cards').append(b)});

none';$('status').textContent='Level complete! '+score+' stars';alert('Level complete! ★ '+score);stop()}else question()},ok?850:1700)}function stop(){if(activeAudio){activeAudio.pause();activeAudio=null} $('flash').textContent='';clearTimeout(answerTimer);mode=-1;clearInterval(repeatTimer);window.speechSynthesis?.cancel()}$('back').onclick=()=>{stop();$('menu').style.display='block';$('hud').style.display=$('answers').style.display='none'};async function initGraphics(){try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color(0xfffdf1);scene.fog=new T.Fog(0xfffdf1,35,95);const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);$('world').append(renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0xb4c7dd,2.3));let light=new T.DirectionalLight(0xffffff,2);light.position.set(-4,10,6);scene.add(light);const ink=0x315e99;const mat=c=>new T.MeshStandardMaterial({color:c,roughness:1});function mesh(g,c,parent=scene){let o=new T.Mesh(g,mat(c));parent.add(o);let e=new T.LineSegments(new T.EdgesGeometry(g,25),new T.LineBasicMaterial({color:ink,transparent:true,opacity:.85}));o.add(e);return o}function box(w,h,d,c,p=scene){return mesh(new T.BoxGeometry(w,h,d),c,p)}function line(points,p=scene,c=ink){let l=new T.Line(new T.BufferGeometry().setFromPoints(points.map(a=>new T.Vector3(...a))),new T.LineBasicMaterial({color:c}));p.add(l);return l}const paper=document.createElement('canvas');paper.width=512;paper.height=512;const pc=paper.getContext('2d');pc.fillStyle='#fffdf0';pc.fillRect(0,0,512,512);for(let i=0;i<512;i+=32){pc.strokeStyle='#b7d5e9';pc.beginPath();pc.moveTo(0,i);pc.lineTo(512,i);pc.stroke()}for(let i=0;i<16000;i++){pc.fillStyle='rgba(100,80,40,.025)';pc.fillRect(Math.random()*512,Math.random()*512,1,1)}const tex=new T.CanvasTexture(paper);tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.repeat.set(12,18);let ground=box(160,.1,240,0xfffdf1);ground.position.set(0,-.1,-55);ground.material.map=tex;ground.material.color.set(0xffffff);for(let z=-170;z<60;z+=1.4)line([[-80,0,z],[80,0,z]],scene,0xb5d4e9);line([[-8,.01,-170],[-8,.01,60]],scene,0xe9a1a1);const player=new T.Group();scene.add(player);let body=mesh(new T.CylinderGeometry(.29,.29,1.65,6),0xffd34f,player);body.position.y=1.45;let eraser=mesh(new T.CylinderGeometry(.3,.3,.35,12),0xef91ad,player);eraser.position.y=2.43;let band=mesh(new T.CylinderGeometry(.31,.31,.16,12),0xbac8d5,player);band.position.y=2.2;let tip=mesh(new T.ConeGeometry(.29,.55,6),0xe5c59a,player);tip.rotation.z=Math.PI;tip.position.y=.36;for(let x of [-.11,.11]){let eye=mesh(new T.SphereGeometry(.045,8,8),0x24324a,player);eye.position.set(x,1.8,.28)}let smile=line([[-.10,1.61,.285],[0,1.55,.30],[.10,1.61,.285]],player);for(let x of [-1,1]){let cheek=mesh(new T.SphereGeometry(.055,10,8),0xf6a1a0,player);cheek.scale.set(1,.5,.3);cheek.position.set(x*.19,1.65,.23)}let limbs=[];for(let x of [-1,1]){let a=box(.1,.65,.1,0x315e99,player);a.position.set(x*.39,1.2,0);a.rotation.z=x*.5;let leg=box(.12,.5,.12,0x315e99,player);leg.position.set(x*.18,.25,0);limbs.push(leg)}let cart=new T.Group();player.add(cart);box(1.2,.35,1.5,0x529be1,cart).position.y=.25;for(let x of [-.65,.65])for(let z of [-.5,.5]){let w=mesh(new T.CylinderGeometry(.25,.25,.15,12),0x344c68,cart);w.rotation.z=Math.PI/2;w.position.set(x,.22,z)}let scenery=[];let rope=line([[0,0,0],[0,0,0]],scene);rope.visible=false;let trail=[];for(let i=0;i<20;i++){let t=mesh(new T.SphereGeometry(.065,6,5),0x65bc83);t.visible=false;trail.push(t)}function supply(g,side,i){let x=side*4.2;if(i%3===0){let cup=mesh(new T.CylinderGeometry(.55,.42,1.1,16),0xb4d5ec,g);cup.position.set(x,.55,0);for(let j=0;j<5;j++){let p=mesh(new T.CylinderGeometry(.085,.085,1.65,6),[0xf3ca4d,0xe9899e,0x78b8d8][j%3],g);p.position.set(x+(j-2)*.15,1.3,0);p.rotation.z=(j-2)*.12}}else if(i%3===1){for(let j=0;j<3;j++){let b=box(1.5,.24,.9,[0xf2c7a0,0xaacde5,0xe9a3b4][j],g);b.position.set(x,.15+j*.25,0);b.rotation.y=j*.14;let pages=box(1.4,.16,.91,0xfffdf1,b);pages.position.x=.03}}else{let e=box(1.4,.45,.75,0xf1a5b8,g);e.position.set(x,.23,0);box(.65,.46,.76,0x8bb8dc,e).position.x=.35}}build=function(){scenery.forEach(o=>scene.remove(o));scenery=[];cart.visible=mode===2;for(let i=0;i<24;i++){let g=new T.Group();scene.add(g);scenery.push(g);g.position.z=-i*5;g.position.x=mode===2||mode===1?Math.sin(i*M let particles=[];confetti=function(){for(let i=0;i<45;i++){let p=box(.09,.15,.05,[0xffc42c,0xef759b,0x51b9dd,0x70c98c][i%4]);p.position.set((Math.random()-.5)*2,2,0);particles.push({p,v:new T.Vector3((Math.random()-.5)*6,Math.random()*5+2,(Math.random()-.5)*5),life:1.5})}};let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(mode<0)return;let speed=(mode===2?8:mode===1?3.5:5)+boost*3;boost*=Math.pow(.3,dt);scenery.forEach(g=>{g.position.z+=speed*dt;if(g.position.z>10)g.position.z-=120;g.userData.star.rotation.y+=dt*2});player.position.y=Math.abs(Math.sin(now*.009))*(mode===2?.04:mode===3?1.1:mode===4?1.6:.12);if(mode===2||mode===1){let near=scenery.reduce((a,b)=>Math.abs(a.position.z)<Math.abs(b.position.z)?a:b,scenery[0]);if(near)player.position.x+=(near.position.x-player.position.x)*dt*4}else player.position.x=0;limbs.forEach((l,i)=>l.rotation.x=Math.sin(now*.012+i*Math.PI)*.7);player.rotation.z=Math.sin(now*.005)*(mode===4?.28:.035);rope.visible=mode===4;if(mode===4){player.position.x=Math.sin(now*.0025)*1.5;let a=rope.geometry.attributes.position;a.setXYZ(0,player.position.x,player.position.y+1.9,0);a.setXYZ(1,Math.sin(now*.0025)*2,7,-4);a.needsUpdate=true;rope.frustumCulled=false}trail.forEach((t,i)=>{t.visible=boost>.15;t.position.set(player.position.x+Math.sin(now*.01+i)*.15,.13,i*.15);t.scale.setScalar(1-i/24)});camera.position.set(mode===1?7:mode===3?3:0,mode===1?12:mode===4?5.5:4.2,mode===1?9:7);camera.lookAt(player.position.x,1,-6);particles=particles.filter(o=>{o.life-=dt;o.v.y-=8*dt;o.p.position.addScaledVector(o.v,dt);o.p.rotation.x+=dt*5;if(o.life<=0){scene.remove(o.p);return false}return true});renderer.render(scene,camera)}requestAnimationFrame(frame);window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
