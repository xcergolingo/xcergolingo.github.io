<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GoLingo Spoken World</title><style>html,body{margin:0;overflow:hidden;background:#8cc9e5;color:white;font:15px system-ui;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}button,select{background:#163c46;color:white;border:1px solid #8dbbc4;border-radius:12px;padding:10px;font:inherit}#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}#top>*{pointer-events:auto}#brand{background:#12343bdc;border-radius:12px;padding:11px;font-weight:800}#card{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#102f39e8;padding:12px 20px;border-radius:18px;text-align:center;min-width:180px;display:none}#card strong{font-size:26px}#joy{position:fixed;bottom:22px;left:22px;width:115px;height:115px;border-radius:50%;border:2px solid #ffffff88;background:#173d4555;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:38px;height:38px;background:#fff9;border-radius:50%}#hint{position:fixed;right:10px;bottom:14px;background:#12343bbd;padding:9px;border-radius:10px;max-width:180px;font-size:12px}#editor{display:none;position:fixed;inset:12% 7%;background:#102e37f5;padding:18px;border-radius:18px;z-index:5}textarea{width:100%;height:55%;background:#eaf5f6;color:#142d31}#editor button{margin:5px}</style></head><body><div id="top"><span id="brand">GoLingo · Spoken World</span><select id="lang"><option value="ja-JP">日本語</option><option value="es-ES">Español</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option><option value="zh-CN">中文</option><option value="en-US">English</option></select><button id="lesson">Import lesson</button><button id="toggle">Show translation</button><button id="repeat">Pause voice</button><button id="mic">🎙 Speak</button><span id="score">0 words</span></div><div id="card"><strong id="word"></strong><div id="meaning"></div></div><div id="joy"><div id="knob"></div></div><div id="hint">Drag to look · tap an object to learn<br>WASD / joystick to walk · microphone for commands</div><div id="editor"><h2>GoLingo lesson JSON</h2><textarea id="data" placeholder='{"primaryLanguage":"en","learningLanguage":"ja","words":[{"word":"木","translation":"tree"}]}'></textarea><div><button id="save">Use lesson</button><button id="close">Close</button></div><p id="status"></p></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color('#8ccce7');scene.fog=new T.Fog('#8ccce7',45,145);const camera=new T.PerspectiveCamera(67,innerWidth/innerHeight,.1,250);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x6a9d78,2));const sun=new T.DirectionalLight(0xffe5b3,2.6);sun.position.set(-30,60,25);scene.add(sun);
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.82});const grass=mat('#7baf6a'),road=mat('#b9aa91'),wall=mat('#f5e6ce'),roof=mat('#bb6859'),wood=mat('#72523c'),leaf=mat('#438c52'),water=mat('#49a8bd');
function box(w,h,d,m,x,y,z){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}function ball(r,m,x,y,z){const o=new T.Mesh(new T.SphereGeometry(r,12,9),m);o.position.set(x,y,z);scene.add(o);return o}
box(240,.1,240,grass,0,-.1,0);box(8,.04,210,road,0,.01,0);box(210,.04,7,road,0,.02,0);
let objects=[];function tag(mesh,type){mesh.userData.kind=type;objects.push(mesh)}
function house(x,z){tag(box(5,3.8,5,wall,x,1.9,z),'house');const r=new T.Mesh(new T.ConeGeometry(4.2,2.7,4),roof);r.rotation.y=Math.PI/4;r.position.set(x,5,z);scene.add(r);tag(r,'house');box(1.1,2,.12,wood,x,1,z+2.55);for(let a of [-1.5,1.5])box(.9,1,.13,mat('#80c6db'),x+a,2.5,z+2.57)}
function tree(x,z){tag(box(.6,3,.6,wood,x,1.5,z),'tree');tag(ball(2.1,leaf,x,4,z),'tree');tag(ball(1.55,leaf,x+1,4.6,z),'tree')}
function pond(x,z){const o=new T.Mesh(new T.CylinderGeometry(5,5,.06,40),water);o.position.set(x,.05,z);scene.add(o);tag(o,'water')}
for(let i=0;i<12;i++){let z=-44+i*8;house(i%2?12:-12,z);tree(i%2?19:-19,z+2)}pond(23,15);for(let i=0;i<35;i++){let x=(Math.random()-.5)*115,z=(Math.random()-.5)*115;if(Math.abs(x)>24||Math.abs(z)>52)tree(x,z)}
const labels={ja:{house:['家','house'],tree:['木','tree'],water:['池','pond'],road:['道','road']},es:{house:['casa','house'],tree:['árbol','tree'],water:['estanque','pond'],road:['calle','road']},fr:{house:['maison','house'],tree:['arbre','tree'],water:['étang','pond'],road:['rue','road']},de:{house:['Haus','house'],tree:['Baum','tree'],water:['Teich','pond'],road:['Straße','road']},zh:{house:['房子','house'],tree:['树','tree'],water:['池塘','pond'],road:['道路','road']},en:{house:['house','house'],tree:['tree','tree'],water:['pond','pond'],road:['road','road']}};
let lesson=[],selected=null,show=false,paused=false,visited=new Set(),lastSpeak=0;const $=id=>document.getElementById(id);
function load(v){lesson=(v.words||v.sentences||v.items||[]).map((w,i)=>typeof w==='string'?{word:w,translation:''}:{...w,id:w.id||String(i)}).filter(w=>w.word);if(v.learningLanguage){const l=Array.from($('lang').options).find(o=>o.value.startsWith(v.learningLanguage));if(l)$('lang').value=l.value} $('status').textContent=lesson.length+' entries loaded';}
function speak(){if(!selected||paused||!('speechSynthesis'in window))return;const synth=speechSynthesis;if(synth.speaking)return;const u=new SpeechSynthesisUtterance(selected.word);u.lang=$('lang').value;u.rate=.85;synth.speak(u);lastSpeak=performance.now()}
function select(kind){const l=$('lang').value.slice(0,2);let entry=lesson.find(w=>w.translation?.toLowerCase().includes(kind))||lesson[visited.size%Math.max(lesson.length,1)];selected=entry||{word:labels[l]?.[kind]?.[0]||kind,translation:labels[l]?.[kind]?.[1]||kind};visited.add(selected.word);$('score').textContent=visited.size+' words';$('word').textContent=selected.word;$('meaning').textContent=show?selected.translation||'':'';$('card').style.display='block';speechSynthesis.cancel();speak()}
$('toggle').onclick=()=>{show=!show;$('toggle').textContent=show?'Hide translation':'Show translation';$('meaning').textContent=show?selected?.translation||'':''};$('repeat').onclick=()=>{paused=!paused;$('repeat').textContent=paused?'Resume voice':'Pause voice';speechSynthesis.cancel();if(!paused)speak()};$('lesson').onclick=()=>$('editor').style.display='block';$('close').onclick=()=>$('editor').style.display='none';$('save').onclick=()=>{try{load(JSON.parse($('data').value));sessionStorage.setItem('golingo:active-lesson:v1',$('data').value);$('editor').style.display='none'}catch(e){$('status').textContent=e.message}};
try{const params=new URLSearchParams(location.search);const raw=params.get('lesson')||sessionStorage.getItem('golingo:active-lesson:v1');if(raw){load(JSON.parse(raw));$('data').value=raw}}catch(e){}
const ray=new T.Raycaster(),pointer=new T.Vector2();let yaw=0,pitch=-.12,pos=new T.Vector3(0,1.7,12),down=null,keys={},joy=[0,0];camera.position.copy(pos);
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.px,dy=e.clientY-down.py;if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>8)down.moved=true;if(down.moved){yaw-=dx*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*.004))}down.px=e.clientX;down.py=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(down&&!down.moved){pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);let hits=ray.intersectObjects(objects);if(hits.length)select(hits[0].object.userData.kind);else select('road')}down=null});
const joyEl=$('joy');function moveJoy(e){const r=joyEl.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/48,y=(e.clientY-r.top-r.height/2)/48,m=Math.max(1,Math.hypot(x,y));joy=[x/m,y/m];$('knob').style.transform='translate('+joy[0]*38+'px,'+joy[1]*38+'px)'}joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);moveJoy(e)});joyEl.addEventListener('pointermove',e=>{if(joyEl.hasPointerCapture(e.pointerId))moveJoy(e)});function stopJoy(){joy=[0,0];$('knob').style.transform=''}joyEl.addEventListener('pointerup',stopJoy);joyEl.addEventListener('pointercancel',stopJoy);onkeydown=e=>{keys[e.key.toLowerCase()]=true};onkeyup=e=>{keys[e.key.toLowerCase()]=false};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Speech recognition is not available in this browser. Tap objects to learn.');return}const rec=new SR();rec.lang=$('lang').value;rec.onresult=e=>{const text=e.results[0][0].transcript.toLowerCase();if(/tree|árbol|arbre|baum|木|树/.test(text)){tree(pos.x+4,pos.z-6);select('tree')}else if(/house|casa|maison|haus|家|房/.test(text)){house(pos.x+8,pos.z-8);select('house')}else if(/pond|池|estanque|étang|teich/.test(text)){pond(pos.x+10,pos.z-10);select('water')}else select('road')};rec.start()};
let prev=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-prev)/1000);prev=t;const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy[1],side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy[0];pos.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)*dt*6;pos.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)*dt*6;pos.x=T.MathUtils.clamp(pos.x,-110,110);pos.z=T.MathUtils.clamp(pos.z,-110,110);camera.position.copy(pos);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;renderer.render(scene,camera);if(selected&&!paused&&t-lastSpeak>2300&&!speechSynthesis.speaking)speak()}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
