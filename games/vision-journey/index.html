<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>GoLingo Vision Journey</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#08051a;color:white;font:15px system-ui;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}#top{position:fixed;top:env(safe-area-inset-top);left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}button{border:1px solid #ffffff55;border-radius:22px;padding:9px 12px;background:#100b2bbb;color:white;font:inherit;pointer-events:auto}#top button{font-size:12px}#panel{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#100b2bc9;border:1px solid #ffffff44;border-radius:18px;padding:10px 20px;text-align:center;min-width:175px;pointer-events:auto}#word{font-size:29px;font-weight:700}#translation{color:#aaf3d9}#modal{display:none;position:fixed;inset:12%;background:#130d29f5;border:1px solid #ffffff66;border-radius:20px;padding:16px;z-index:4}textarea{width:100%;height:55%;background:#08051a;color:white;border:1px solid #777;border-radius:9px;padding:8px}#hint{position:fixed;top:75px;left:12px;color:#d8caffbb;font-size:12px;pointer-events:none}button:active{background:#60488b}</style><canvas id="scene"></canvas><div id="top"><button id="start">▶ Start / Audio</button><button id="auto">Autopilot ON</button><button id="world">🌿 Forest</button><button id="trans">Translation ON</button><button id="words">Words / JSON</button><span id="count">0 collected</span></div><div id="hint">Drag to look around · tap glowing words</div><div id="panel"><div id="word">水</div><div id="translation">water</div><button id="next">Next word ↗</button></div><div id="modal"><h3>GoLingo vocabulary</h3><p>Paste GoLingo JSON or word|translation lines</p><textarea id="data"></textarea><button id="load">Load</button><button id="close">Close</button></div><script>
(()=>{'use strict';const c=document.getElementById('scene'),ctx=c.getContext('2d',{alpha:false});let W=0,H=0,dpr=1,t=0,look=0,mode=0,auto=true,show=true,active=false,idx=0,collected=new Set(),last=0,drag=false,downX=0;let items=[{word:'水',translation:'water'},{word:'光',translation:'light'},{word:'夢',translation:'dream'},{word:'森',translation:'forest'},{word:'星',translation:'star'},{word:'空',translation:'sky'},{word:'花',translation:'flower'},{word:'風',translation:'wind'}],lang='ja';const $=id=>document.getElementById(id);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const rand=n=>{let x=Math.sin(n*127.1+43.7)*43758.5453;return x-Math.floor(x)};function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}function poly(x,y,r,n,rot,color){ctx.beginPath();for(let i=0;i<n;i++){let a=rot+i*Math.PI*2/n;let xx=x+Math.cos(a)*r,yy=y+Math.sin(a)*r;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke()}function frame(ms){let dt=Math.min((ms-last)/1000||0,.05);last=ms;t+=dt;if(auto)look+=dt*.12;let cx=W/2+Math.sin(look)*W*.12,cy=H*.49;let g=ctx.createLinearGradient(0,0,0,H);if(mode===0){g.addColorStop(0,'#0b0730');g.addColorStop(.55,'#24104d');g.addColorStop(1,'#071d20')}else if(mode===1){g.addColorStop(0,'#100522');g.addColorStop(.5,'#400c61');g.addColorStop(1,'#07071c')}else{g.addColorStop(0,'#081334');g.addColorStop(.5,'#3d1a67');g.addColorStop(1,'#0c1930')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);glow(cx,cy,W*.65,mode===0?'#5333b644':'#aa39bb44');for(let i=0;i<135;i++){let x=rand(i+1)*W+Math.sin(t*.3+i)*12,y=rand(i+77)*H+Math.cos(t*.4+i)*8;ctx.fillStyle='hsla('+(170+rand(i+23)*160)+',100%,80%,'+(.15+rand(i+31)*.65)+')';ctx.beginPath();ctx.arc(x,y,.6+rand(i+41)*2,0,7);ctx.fill()}if(mode===1){for(let j=24;j>=0;j--){let p=((j/25+t*.075)%1),r=(1-p)*Math.max(W,H)*.85+15;poly(cx,cy,r,6,t*.12+j*.13,'hsla('+((j*19+t*35)%360)+',95%,70%,'+(.2+p*.6)+')');glow(cx+Math.cos(j+t)*r*.3,cy+Math.sin(j+t)*r*.3,25,'#f859cf44')}}else{let horizon=H*.58;for(let layer=0;layer<3;layer++){ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+8;x+=8){let y=horizon+layer*H*.11+Math.sin(x*.013+layer*2+look)*35+Math.sin(x*.036+layer)*18;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=['#202050','#123e49','#082e30'][layer];ctx.fill()}for(let i=0;i<65;i++){let depth=rand(i+15),x=((rand(i+22)*W-look*60*(.2+depth))%W+W)%W,y=H*.48+depth*H*.55,s=12+depth*65;ctx.strokeStyle='hsla('+(mode===0?170:270)+',75%,45%,'+(.3+depth*.6)+')';ctx.lineWidth=2+depth*5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-s*2.1);ctx.stroke();for(let b=0;b<4;b++){glow(x+Math.sin(i+b)*s*.4,y-s*(1.3+b*.23),s*(.7+depth*.5),b%2?'#6c41ed55':'#15e9ba55')}glow(x,y-s*1.9,s*.5,'#f66cfd44')}if(mode===2){for(let k=0;k<8;k++)poly(cx+Math.sin(k*2+t*.2)*W*.4,cy+Math.cos(k*3)*H*.3,35+k*8,8,t*.3+k,'#eeaaff66')}}for(let k=0;k<Math.min(items.length,18);k++){let a=k*2.399+t*.16-look*.6,depth=.45+.35*Math.sin(t*.23+k),x=cx+Math.sin(a)*W*depth,y=cy+Math.cos(a*1.3)*H*.32;glow(x,y,45,'#4afce866');ctx.beginPath();ctx.arc(x,y,14+Math.sin(t*2+k)*2,0,7);ctx.fillStyle='#affff0';ctx.fill();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillText(items[k].word,x,y-26)}requestAnimationFrame(frame)}requestAnimationFrame(frame);function speak(){if(!active||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(items[idx].word);u.lang=lang;u.rate=.8;speechSynthesis.speak(u)}function update(){let a=items[idx];$('word').textContent=a.word;$('translation').textContent=show?a.translation||'':'';$('count').textContent=collected.size+' collected';speak()}function advance(n){idx=(n+items.length)%items.length;collected.add(idx);update()}$('start').onclick=()=>{active=true;$('start').textContent='🔊 Audio ON';speak()};$('auto').onclick=()=>{auto=!auto;$('auto').textContent='Autopilot '+(auto?'ON':'OFF')};$('world').onclick=()=>{mode=(mode+1)%3;$('world').textContent=['🌿 Forest','🌀 Vision Tunnel','✨ Spirit World'][mode]};$('trans').onclick=()=>{show=!show;$('trans').textContent='Translation '+(show?'ON':'OFF');update()};$('next').onclick=()=>advance(idx+1);$('words').onclick=()=>{$('modal').style.display='block'};$('close').onclick=()=>{$('modal').style.display='none'};$('load').onclick=()=>{try{let s=$('data').value.trim(),obj=s.startsWith('{')?JSON.parse(s):null,arr=obj?.words||s.split(/\n/).map(v=>{let [word,translation]=v.split('|');return {word,translation}});arr=arr.filter(v=>v.word);if(!arr.length)throw Error('No words found');items=arr;lang=obj?.learningLanguage||lang;idx=0;collected.clear();$('modal').style.display='none';update()}catch(e){alert('Invalid vocabulary: '+e.message)}};c.addEventListener('pointerdown',e=>{drag=true;downX=e.clientX;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){look+=(e.clientX-downX)*.006;downX=e.clientX}});c.addEventListener('pointerup',e=>{drag=false;if(Math.abs(e.clientX-downX)<12)advance(idx+1)});addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')advance(idx+1);if(e.key==='ArrowLeft')look-=.2});update()})();
</script></html>
