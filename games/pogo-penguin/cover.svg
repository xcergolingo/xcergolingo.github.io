<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">Pogo Penguin — Word Hops</title>
<desc id="desc">A happy black-and-white penguin bounces on a candy-red pogo stick across bright white ice floes in a turquoise sea. Snowy mountains and a yellow sun brighten the Arctic scene.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7ed0f2"/><stop offset=".72" stop-color="#c6f3ff"/><stop offset="1" stop-color="#e2fbf9"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#48c8df"/><stop offset=".5" stop-color="#18a4cc"/><stop offset="1" stop-color="#087ca8"/></linearGradient>
  <linearGradient id="ice" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#c9f4ff"/></linearGradient>
  <linearGradient id="iceEdge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7bcadd"/><stop offset="1" stop-color="#429cbf"/></linearGradient>
  <radialGradient id="sun"><stop stop-color="#fffdf0"/><stop offset=".35" stop-color="#fff4b9" stop-opacity=".8"/><stop offset="1" stop-color="#fff9d9" stop-opacity="0"/></radialGradient>
  <linearGradient id="pogo" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b82c48"/><stop offset=".47" stop-color="#ff7774"/><stop offset="1" stop-color="#c63956"/></linearGradient>
  <linearGradient id="penguin" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#2d4d64"/><stop offset=".6" stop-color="#192f48"/><stop offset="1" stop-color="#101f36"/></linearGradient>
</defs>
