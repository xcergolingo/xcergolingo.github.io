(()=>{'use strict';const canvas=document.getElementById('gl'),hud=document.getElementById('hud'),ctx=hud.getContext('2d'),status=document.getElementById('status');const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});if(!gl){status.textContent='WebGL2 required';return}const vertex='#version 300 es\nprecision highp float;in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';const fragment=`#version 300 es
