<!doctype html><html lang="en"><head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1162362293415761"
     crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GoLingo Word Breaker</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;background:#080b12;color:white;font:14px system-ui;display:grid;place-items:center;height:100dvh;overflow:hidden}#wrap{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.777vw);background:#10131d}canvas{width:100%;height:100%;touch-action:none}#hud{position:absolute;top:5px;left:10px;right:10px;pointer-events:none;text-align:center}#stats{display:flex;justify-content:space-between;font-size:12px;font-weight:800}#lesson{background:#0a0f1de8;border:1px solid #ffffff33;border-radius:10px;margin-top:10px;padding:7px}#word{font-size:21px;font-weight:800}#translation{color:#8deaff;font-size:13px}#sentence{color:#b7c0d2;font-size:11px}#buttons{position:absolute;right:8px;bottom:8px;display:flex;gap:5px}button,select,textarea{font:inherit}button{background:#293753;color:white;border:1px solid #ffffff40;border-radius:8px;padding:8px}#overlay{position:absolute;inset:0;background:#070a14eb;display:grid;place-items:center;padding:12px}#panel{width:100%;max-height:95%;overflow:auto;text-align:center;background:#1b2233;border:1px solid #5a647d;border-radius:16px;padding:15px}h1{color:#ff6279;margin:4px 0;font-size:25px}p{font-size:12px;color:#bfc8d9}label{display:block;text-align:left;margin:8px 0 3px}select,textarea{width:100%;background:#0d1423;color:white;border:1px solid #65708c;border-radius:7px;padding:7px}textarea{height:70px;user-select:text;-webkit-user-select:text}button.primary{background:#e94c66;font-weight:800;margin-top:10px;padding:11px 20px}#notice{position:absolute;top:31%;left:0;right:0;text-align:center;color:#7df2ff;font-weight:900;pointer-events:none}</style></head><body><div id="wrap"><canvas id="c" width="360" height="640"></canvas><div id="hud"><div id="stats"><span id="score">SCORE 0</span><span id="left">BRICKS 240</span><span id="life">♥♥♥</span></div><div id="lesson"><div id="word">GoLingo Word Breaker</div><div id="translation">Break bricks to learn words</div><div id="sentence"></div></div></div><div id="notice"></div><div id="buttons"><button id="sound">🔊</button><button id="repeat">↻ Speak</button><button id="pause">Ⅱ</button></div><div id="overlay"><div id="panel"><h1>WORD BREAKER</h1><p>Smash bricks. Hear words. Learn languages.</p><label>Learning language</label><select id="lang"><option value="es">Spanish</option><option value="ja">Japanese</option><option value="fr">French</option><option value="de">German</option><option value="zh">Chinese</option></select><label>Mode</label><select id="mode"><option value="learn">Learn (word + translation)</option><option value="listen">Listening (hide translation)</option><option value="review">Review (guess word)</option></select><label>Optional custom words: word | translation | sentence</label><textarea id="custom" placeholder="hola | hello | ¡Hola!"></textarea><p>Accepts GoLingo JSON through ?data= or postMessage.</p><button class="primary" id="start">▶ START GAME</button><p>Touch/drag or mouse to move • arrows/A-D • Space to launch</p></div></div></div><script>
/* Customize: ROWS, COLS, SPEED, POWER_CHANCE, START_LIVES */
const ROWS=20,COLS=12,SPEED=4.4,POWER_CHANCE=.075,START_LIVES=3,W=360,H=640;
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d');
const dict={es:[['hola','hello','¡Hola!'],['agua','water','Quiero agua.'],['casa','house','Mi casa.'],['gato','cat','El gato duerme.'],['gracias','thank you','Muchas gracias.']],ja:[['水','water','水を飲みます。'],['猫','cat','猫がいます。'],['家','house','家に帰ります。'],['ありがとう','thank you','ありがとうございます。']],fr:[['bonjour','hello','Bonjour!'],['eau','water','Je bois de l’eau.'],['chat','cat','Le chat dort.']],de:[['Hallo','hello','Hallo!'],['Wasser','water','Ich trinke Wasser.'],['Katze','cat','Die Katze schläft.']],zh:[['你好','hello','你好！'],['水','water','我喝水。'],['猫','cat','猫在睡觉。']]};
let imported=null,words=[],index=0,current=null,bricks=[],balls=[],drops=[],particles=[],score=0,lives=3,remaining=0,hits=0,running=false,paused=false,sound=true,frameTime=0,elapsed=0,mult=1,multEnd=0,wideEnd=0,keys={},messageTimer=0;
const paddle={x:147,target:180,y:587,w:66};
function parseData(d){try{if(typeof d==='string')d=JSON.parse(d);if(Array.isArray(d))d={words:d};if(!Array.isArray(d.words))return;const list=d.words.filter(w=>w.word).map(w=>({word:String(w.word),translation:String(w.translation||''),sentence:String(w.sentence||'')}));if(list.length){imported={words:list,lang:d.learningLanguage||'es'};if(running){words=list;index=0;nextWord()}}}catch(e){console.warn('GoLingo JSON invalid',e)}}
try{const p=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1));parseData(p.get('data')||h.get('data'))}catch(e){}
addEventListener('message',e=>{const d=e.data;if(d&&typeof d==='object'&&(d.words||d.type==='golingo-words'||d.type==='GOLINGO_WORDS'))parseData(d.payload||d.data||d)});
function say(t){if(!sound||!t||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=imported?.lang||$('lang').value;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
let ac;function tone(f=400){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),v=ac.createGain();o.frequency.value=f;v.gain.setValueAtTime(.02,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.06);o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.06)}catch(e){}}
function announce(t){$('notice').textContent=t;clearTimeout(messageTimer);messageTimer=setTimeout(()=>$('notice').textContent='',1000)}
function nextWord(){if(!words.length)return;current=words[index++%words.length];const m=$('mode').value;$('word').textContent=m==='review'?current.translation:current.word;$('translation').textContent=m==='listen'?'Listen and remember':m==='review'?'Guess the word':current.translation;$('sentence').textContent=current.sentence;if(m!=='review')say(current.word)}
function ball(stuck){balls.push({x:paddle.x+paddle.w/2,y:paddle.y-7,vx:2.1,vy:-SPEED,stuck,trail:[]})}
function hud(){$('score').textContent='SCORE '+score;$('left').textContent='BRICKS '+remaining;$('life').textContent='♥'.repeat(lives)}
function start(){let text=$('custom').value.trim();words=imported?.words||(text?text.split('\n').map(s=>{let a=s.split('|').map(x=>x.trim());return {word:a[0],translation:a[1]||'',sentence:a[2]||''}}).filter(w=>w.word):dict[$('lang').value].map(a=>({word:a[0],translation:a[1],sentence:a[2]})));index=0;score=0;lives=START_LIVES;hits=0;elapsed=0;mult=1;wideEnd=0;multEnd=0;running=true;paused=false;balls=[];drops=[];particles=[];bricks=[];paddle.w=66;paddle.x=147;paddle.target=180;
let margin=13,gap=2,bw=(W-2*margin-(COLS-1)*gap)/COLS;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)bricks.push({x:margin+c*(bw+gap),y:145+r*16,w:bw,h:14,alive:true,r});remaining=bricks.length;ball(true);nextWord();hud();$('overlay').style.display='none'}
function burst(x,y,col='#fff',count=9){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=Math.random()*3+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:30,color:col})}}
function finish(win){running=false;$('overlay').style.display='grid';$('panel').innerHTML=win?'<h1 style="color:#ffd76b">Congratulations<br>You win!</h1><div style="font-size:45px;color:#ffd54c">★ ★ ★</div><p>Score '+score+'</p><button class="primary" onclick="location.reload()">PLAY AGAIN</button>':'<h1>GAME OVER</h1><p>Score '+score+'</p><button class="primary" onclick="location.reload()">RESTART</button>'}
function breakBrick(b){if(!b.alive)return;b.alive=false;remaining--;hits++;score+=10*mult;burst(b.x+b.w/2,b.y+7,'#ff6677');tone(370+hits%12*35);if(Math.random()<POWER_CHANCE)drops.push({x:b.x+b.w/2,y:b.y+7,type:['multi','wide','triple','life'][Math.random()*4|0]});if(hits%3===0)nextWord();hud();if(!remaining)finish(true)}
function collect(d){burst(d.x,d.y,'#70f2ff',22);tone(900);if(d.type==='multi'){let b=balls[0];if(b)for(let i=-1;i<=1;i++)balls.push({x:b.x,y:b.y,vx:b.vx+i*1.6,vy:-Math.abs(b.vy),stuck:false,trail:[]});announce('+3 BALLS')}else if(d.type==='wide'){wideEnd=elapsed+12;announce('WIDE PADDLE')}else if(d.type==='triple'){mult=3;multEnd=elapsed+12;announce('×3 SCORE')}else{lives=Math.min(9,lives+1);announce('+1 LIFE')}hud()}
function update(dt){if(!running||paused)return;elapsed+=dt/60;if(elapsed>multEnd)mult=1;let desired=elapsed<wideEnd?106:66;paddle.w+=(desired-paddle.w)*.14;if(keys.ArrowLeft||keys.a)paddle.target-=7*dt;if(keys.ArrowRight||keys.d)paddle.target+=7*dt;paddle.target=Math.max(14+paddle.w/2,Math.min(W-14-paddle.w/2,paddle.target));paddle.x+=(paddle.target-paddle.w/2-paddle.x)*Math.min(1,.28*dt);
for(const b of balls){if(b.stuck){b.x=paddle.x+paddle.w/2;b.y=paddle.y-7;continue}b.trail.push([b.x,b.y]);if(b.trail.length>6)b.trail.shift();let speed=Math.min(8.5,Math.hypot(b.vx,b.vy)+.00015*dt),len=Math.hypot(b.vx,b.vy)||1;b.vx=b.vx/len*speed;b.vy=b.vy/len*speed;let steps=Math.ceil(speed*dt/2);for(let s=0;s<steps;s++){b.x+=b.vx*dt/steps;b.y+=b.vy*dt/steps;if(b.x<14){b.x=14;b.vx=Math.abs(b.vx)}if(b.x>W-14){b.x=W-14;b.vx=-Math.abs(b.vx)}if(b.y<137){b.y=137;b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+4>=paddle.y&&b.y-4<=paddle.y+10&&b.x>paddle.x&&b.x<paddle.x+paddle.w){let a=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2)*1.1;b.y=paddle.y-5;b.vx=Math.sin(a)*speed;b.vy=-Math.max(1.8,Math.cos(a)*speed);tone(250)}
let hit=false;for(const q of bricks){if(!q.alive)continue;let cx=Math.max(q.x,Math.min(b.x,q.x+q.w)),cy=Math.max(q.y,Math.min(b.y,q.y+q.h));if((b.x-cx)**2+(b.y-cy)**2<16){if(Math.abs(b.x-cx)>Math.abs(b.y-cy))b.vx*=-1;else b.vy*=-1;breakBrick(q);hit=true;break}}if(hit||!running)break}}
balls=balls.filter(b=>b.y<H+12);if(!balls.length){lives--;hud();if(!lives){finish(false);return}ball(true);announce('TAP TO LAUNCH')}
for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=1.7*dt;if(d.y>paddle.y-10&&d.y<paddle.y+12&&d.x>=paddle.x-12&&d.x<=paddle.x+paddle.w+12){collect(d);drops.splice(i,1)}else if(d.y>H)drops.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.t-=dt;if(p.t<=0)particles.splice(i,1)}}
function draw(){g.fillStyle='#10131d';g.fillRect(0,0,W,H);g.fillStyle='#343a48';g.fillRect(4,132,6,450);g.fillRect(350,132,6,450);g.fillStyle='#ff4961';g.fillRect(10,132,340,3);for(const b of bricks)if(b.alive){g.fillStyle=['#f24458','#e73b50','#d7354b','#f34c60'][b.r%4];g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='#ffffff18';g.fillRect(b.x,b.y,b.w,2)}
g.shadowColor='#ff5a7b';g.shadowBlur=14;g.fillStyle='#ff5a7b';g.fillRect(paddle.x,paddle.y,paddle.w,11);g.shadowBlur=0;for(const b of balls){for(let i=0;i<b.trail.length;i++){g.fillStyle='rgba(255,255,255,'+(i/b.trail.length*.3)+')';g.beginPath();g.arc(b.trail[i][0],b.trail[i][1],2,0,7);g.fill()}g.shadowColor='#fff';g.shadowBlur=12;g.fillStyle='white';g.beginPath();g.arc(b.x,b.y,4,0,7);g.fill();g.shadowBlur=0}
for(const d of drops){g.fillStyle={multi:'#7df2ff',wide:'#a8baff',triple:'#76ffac',life:'#ff9eaf'}[d.type];g.beginPath();g.roundRect(d.x-12,d.y-9,24,18,5);g.fill();g.fillStyle='#111';g.textAlign='center';g.font='bold 11px system-ui';g.fillText({multi:'+3',wide:'W',triple:'×3',life:'♥'}[d.type],d.x,d.y+4)}for(const p of particles){g.globalAlpha=p.t/30;g.fillStyle=p.color;g.fillRect(p.x,p.y,2.5,2.5)}g.globalAlpha=1}
function frame(t){let dt=Math.min(2,(t-frameTime)/16.67||1);frameTime=t;update(dt);draw();requestAnimationFrame(frame)}
function point(e){let r=cv.getBoundingClientRect();paddle.target=(e.clientX-r.left)*W/r.width;if(running)balls.forEach(b=>b.stuck=false)}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);point(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')point(e)});addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' ')balls.forEach(b=>b.stuck=false);if(e.key.toLowerCase()==='p')togglePause()});addEventListener('keyup',e=>keys[e.key]=false);
function togglePause(){if(!running)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';announce(paused?'PAUSED':'GO!')}
$('start').onclick=start;$('pause').onclick=togglePause;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}};$('repeat').onclick=()=>{if(current){say(current.word);if($('mode').value==='review'){$('word').textContent=current.word;$('translation').textContent=current.translation}}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause()});requestAnimationFrame(frame);
</script></body></html>
