  <linearGradient id="floor" y2="1" x2="0"><stop stop-color="#263d3e"/><stop offset="1" stop-color="#0c1922"/></linearGradient>
  <linearGradient id="bottom" y2="1" x2="0"><stop stop-color="#0a1019" stop-opacity="0"/><stop offset=".62" stop-color="#0a1019" stop-opacity=".75"/><stop offset="1" stop-color="#080e15"/></linearGradient>
  <linearGradient id="gun" x2="1" y2=".4"><stop stop-color="#70928e"/><stop offset=".2" stop-color="#384c4e"/><stop offset=".48" stop-color="#15252a"/><stop offset="1" stop-color="#0a161b"/></linearGradient>
  <radialGradient id="red"><stop stop-color="#e36251" stop-opacity=".42"/><stop offset="1" stop-color="#b52d37" stop-opacity="0"/></radialGradient>
  <radialGradient id="teal"><stop stop-color="#97dbcf" stop-opacity=".28"/><stop offset="1" stop-color="#4ba6a1" stop-opacity="0"/></radialGradient>
