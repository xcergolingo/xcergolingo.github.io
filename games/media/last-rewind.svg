  <pattern id="tapes-small" width="39" height="53" patternUnits="userSpaceOnUse"><rect width="39" height="53" fill="#17272e"/><rect x="2" y="2" width="9" height="45" fill="#697d79"/><rect x="13" y="4" width="11" height="43" fill="#a76352"/><rect x="27" y="1" width="10" height="46" fill="#a49c73"/><path d="M5 8v24m12-19h4m9-5v18" stroke="#e1d9ba" stroke-width="1.5" opacity=".7"/><rect y="48" width="39" height="5" fill="#75827a"/></pattern>
