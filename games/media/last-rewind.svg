<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Last Rewind — a night shift of words</title>
<desc id="desc">Original illustration of a late-night video rental store. Red neon, teal fluorescent lights and rows of VHS tapes surround a vocabulary card reading agua, water.</desc>
<defs>
