  <title id="title">Ink &amp; Iron — Word Patrol cover illustration</title>
  <desc id="desc">An original cartoon-noir illustration: a cream and yellow wind-up robot with pie-cut eyes, black rubber-hose limbs and white gloves stands in a ruined orange and violet street. A speech balloon teaches hola, hello. A comic POW burst and a foreground yellow blaster suggest the first-person action.</desc>
